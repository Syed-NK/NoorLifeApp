# Supabase local configuration for NoorLife.
#
# Project-scoped settings only. No keys, tokens or secrets belong in this file — the CLI
# reads credentials from your own environment, and `supabase link` stores them outside the repo.

project_id = "noorlife"

[api]
enabled = true
port = 54321
# `graphql_public` is included because `config push` sends this list to the linked project, and the
# hosted default exposes it. Omitting it here would silently remove it there.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The Expo scheme already declared in app.json. Reset-password and OAuth callbacks
# come back to the app through it, so it must match exactly.
site_url = "noorlifeapp://"
additional_redirect_urls = ["noorlifeapp://", "noorlifeapp://reset-password", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# ── DEVELOPMENT SETTING — RE-ENABLE BEFORE RELEASE ──────────────────────────
# `false` auto-confirms new accounts, so signup returns a live session and no confirmation email is
# sent. Turned off deliberately: the project's built-in email service allows only a few messages an
# hour, and that quota — not any fault in the app — is what was blocking every signup attempt.
#
# Two consequences to remember:
#   • Verify Email (screen 08) is skipped entirely, because there is nothing left to verify.
#   • Anyone can register any address without proving they control it.
#
# Set this back to `true` once custom SMTP is configured (Authentication -> Emails -> SMTP Settings),
# which removes the quota and makes confirmations practical again.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true

[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false
