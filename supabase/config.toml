# Supabase local configuration for NoorLife.
#
# Project-scoped settings only. No keys, tokens or secrets belong in this file — the CLI
# reads credentials from your own environment, and `supabase link` stores them outside the repo.

project_id = "noorlife"

[api]
enabled = true
port = 54321
# `graphql_public` is included because `config push` sends this list to the linked project, and the
# hosted default exposes it. Omitting it here would silently remove it there.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The Expo scheme already declared in app.json. Reset-password and OAuth callbacks
# come back to the app through it, so it must match exactly.
site_url = "noorlifeapp://"
additional_redirect_urls = ["noorlifeapp://", "noorlifeapp://reset-password", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# ── DEVELOPMENT SETTING — RE-ENABLE BEFORE RELEASE ──────────────────────────
# `false` auto-confirms new accounts, so signup returns a live session and no confirmation email is
# sent. Turned off deliberately: the project's built-in email service allows only a few messages an
# hour, and that quota — not any fault in the app — is what was blocking every signup attempt.
#
# Two consequences to remember:
#   • Verify Email (screen 08) is skipped entirely, because there is nothing left to verify.
#   • Anyone can register any address without proving they control it.
#
# Set this back to `true` once custom SMTP is configured (Authentication -> Emails -> SMTP Settings),
# which removes the quota and makes confirmations practical again.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true

# ── Email OTP length — must stay 6 ──────────────────────────────────────────
# The approved Verify Email design (screen 08) renders exactly six boxes, and `OTP_LENGTH` in
# src/features/entry-auth/components/otp-input.tsx is 6. A project set to 8 would email a code the
# UI cannot accept — the user would type six digits, submit, and be told the code was wrong.
#
# This was previously unpinned here, so the value was whatever the dashboard held and the CLI had
# nothing to compare against. Declaring it makes the contract version-controlled: `config push` now
# reports drift instead of silently agreeing.
otp_length = 6
otp_expiry = 3600

[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false

# ── Noor AI Edge Function (Phase AI-2) ──────────────────────────────────────
# The endpoint contracted in docs/NOOR_AI_BACKEND_CONTRACT.md §C.1. AI-2 is the skeleton only: no
# provider key exists, no provider SDK is installed, and the production dependency graph fails
# closed with `503 service_unavailable` rather than answering.
#
# `verify_jwt` is declared explicitly even though `true` is the documented default. AI-1 §D.2 makes
# that a requirement rather than a preference: this endpoint spends money, so "the platform
# validates the JWT before your handler runs" must be a version-controlled fact that `config push`
# can report drift against, not a default someone could change in the dashboard without a diff.
#
# Leaving it on is what creates the two-producer error split recorded in §C.9 — a missing or
# malformed JWT is refused by the gateway in Supabase's platform shape with no NoorLife
# `request_id`, and only errors raised after the handler starts use NoorLife's own schema. The
# handler re-verifies the claims it depends on regardless (§D.2 mechanism 2), because the
# documentation describes what the gateway does in one sentence and does not enumerate which claims
# it checks.
[functions.noor-ai]
enabled = true
verify_jwt = true
